<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroid Blaster</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Orbitron',monospace; }
canvas { position:fixed; top:0; left:0; z-index:1; }

/* All UI sits above canvas */
#hud {
  position:fixed; top:0; left:0; right:0;
  z-index:10; padding:16px 20px;
  display:flex; justify-content:space-between; align-items:flex-start;
  pointer-events:none;
}
.hud-block { display:flex; flex-direction:column; gap:3px; }
.hud-label { font-size:9px; letter-spacing:3px; color:rgba(79,195,247,0.5); }
.hud-val   { font-size:22px; font-weight:900; color:#4fc3f7; }
.lives-row { display:flex; gap:5px; }
.life { font-size:16px; }
.life.dead { opacity:0.15; }

#bossBar {
  position:fixed; top:72px; left:50%; transform:translateX(-50%);
  z-index:10; width:280px; text-align:center; display:none;
}
#bossLabel { font-size:9px; letter-spacing:3px; color:#ff5252; margin-bottom:5px; }
#bossTrack { width:100%; height:7px; background:rgba(255,82,82,0.2); border-radius:4px; border:1px solid rgba(255,82,82,0.4); overflow:hidden; }
#bossFill  { height:100%; background:linear-gradient(90deg,#ff5252,#ff1744); border-radius:4px; transition:width 0.15s; }

#puBar {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  z-index:10; display:flex; gap:8px; pointer-events:none;
}
.pu { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:20px; padding:5px 13px; font-size:10px; color:rgba(255,255,255,0.4); letter-spacing:1px; transition:all 0.2s; }
.pu.on { background:rgba(79,195,247,0.2); border-color:#4fc3f7; color:#4fc3f7; }

#flash {
  position:fixed; top:45%; left:50%; transform:translate(-50%,-50%);
  z-index:10; font-size:34px; font-weight:900; letter-spacing:3px;
  color:#ffd54f; text-shadow:0 0 30px rgba(255,213,79,0.5);
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}

/* Screens */
.screen {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  background:rgba(0,0,5,0.88);
}
.screen.off { display:none; }
.stitle { font-size:46px; font-weight:900; color:#4fc3f7; letter-spacing:4px; text-align:center; text-shadow:0 0 30px rgba(79,195,247,0.4); line-height:1.1; }
.ssub   { font-size:11px; color:rgba(79,195,247,0.5); letter-spacing:3px; }
.sbig   { font-size:30px; font-weight:700; color:#ffd54f; letter-spacing:2px; }
.sbtn {
  margin-top:6px; background:none; border:2px solid #4fc3f7; border-radius:4px;
  padding:13px 34px; font-family:'Orbitron',monospace; font-size:12px; font-weight:700;
  letter-spacing:3px; color:#4fc3f7; cursor:pointer; transition:all 0.2s;
}
.sbtn:hover { background:rgba(79,195,247,0.1); box-shadow:0 0 20px rgba(79,195,247,0.3); }
.sbtn.red { border-color:#ff5252; color:#ff5252; }
.sbtn.red:hover { background:rgba(255,82,82,0.1); }
.shint { font-size:10px; color:rgba(255,255,255,0.25); letter-spacing:1px; text-align:center; line-height:2; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-block">
    <div class="hud-label">SCORE</div>
    <div class="hud-val" id="hScore">0</div>
  </div>
  <div class="hud-block" style="align-items:center">
    <div class="hud-label">LEVEL</div>
    <div class="hud-val" id="hLevel">1</div>
  </div>
  <div class="hud-block" style="align-items:flex-end">
    <div class="hud-label">LIVES</div>
    <div class="lives-row" id="hLives">
      <span class="life">🚀</span><span class="life">🚀</span><span class="life">🚀</span>
    </div>
  </div>
</div>

<div id="bossBar">
  <div id="bossLabel">⚠ BOSS</div>
  <div id="bossTrack"><div id="bossFill" style="width:100%"></div></div>
</div>

<div id="puBar">
  <div class="pu" id="puR">⚡ RAPID</div>
  <div class="pu" id="puS">🛡 SHIELD</div>
  <div class="pu" id="puT">🔱 TRIPLE</div>
</div>

<div id="flash"></div>

<div class="screen" id="sStart">
  <div class="stitle">ASTEROID<br>BLASTER</div>
  <div class="ssub">DEFEND THE GALAXY</div>
  <button class="sbtn" id="btnStart">LAUNCH →</button>
  <div class="shint">WASD / ARROWS — Move &nbsp;·&nbsp; SPACE — Shoot<br>Collect power-ups · Boss every 5 levels</div>
</div>

<div class="screen off" id="sOver">
  <div class="stitle" style="color:#ff5252">GAME OVER</div>
  <div class="sbig" id="oScore"></div>
  <div class="ssub" id="oLevel"></div>
  <button class="sbtn red" id="btnRetry">RETRY →</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── VARS ─────────────────────────────────────────────────────────
let running = false;
let score, lives, level, frame;
let ship, bullets=[], rocks=[], parts=[], pups=[], boss;
let levelClearing = false;
let clearFrames = 0;
let bossHP, bossMaxHP, bossActive;
let puR, puS, puT, inv, shootCD, mult, multT;
let stars = [];
const keys = {};

// ── STARS ────────────────────────────────────────────────────────
function makeStars() {
  stars = Array.from({length:200}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: 0.4 + Math.random()*1.4,
    a: 0.2 + Math.random()*0.7
  }));
}

// ── HELPERS ──────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
function wrap(o) {
  if (o.x < -120) o.x = W+120;
  if (o.x > W+120) o.x = -120;
  if (o.y < -120) o.y = H+120;
  if (o.y > H+120) o.y = -120;
}
function rnd(min, max) { return min + Math.random()*(max-min); }
function edge() {
  const s = Math.floor(Math.random()*4);
  if (s===0) return {x:rnd(0,W), y:-80};
  if (s===1) return {x:W+80, y:rnd(0,H)};
  if (s===2) return {x:rnd(0,W), y:H+80};
  return {x:-80, y:rnd(0,H)};
}

// ── SHIP ─────────────────────────────────────────────────────────
function makeShip() {
  return {x:W/2, y:H/2, vx:0, vy:0, angle:-Math.PI/2, r:15, thrusting:false};
}

function drawShip() {
  if (!ship) return;
  if (inv > 0 && Math.floor(inv/5)%2===0) return;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);

  // Shield bubble
  if (puS > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, TAU);
    ctx.strokeStyle = `rgba(79,195,247,${0.25+0.2*Math.sin(frame*0.12)})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Ship body
  ctx.beginPath();
  ctx.moveTo(20, 0);
  ctx.lineTo(-13, -11);
  ctx.lineTo(-7, 0);
  ctx.lineTo(-13, 11);
  ctx.closePath();
  ctx.fillStyle = '#4fc3f7';
  ctx.fill();
  ctx.strokeStyle = '#b3e5fc';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Thruster flame
  if (ship.thrusting) {
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(-7 - 18 - Math.random()*14, (Math.random()-0.5)*9);
    ctx.strokeStyle = `rgba(255,${80+Math.random()*120},0,0.9)`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.restore();
}

// ── ASTEROIDS ────────────────────────────────────────────────────
function makeRock(x, y, sz) {
  const sizes = {large:{r:48,hp:3,pts:100}, medium:{r:26,hp:2,pts:50}, small:{r:13,hp:1,pts:25}};
  sz = sz || (Math.random()<0.3?'small':Math.random()<0.5?'medium':'large');
  const info = sizes[sz];
  const ang = Math.random()*TAU;
  const spd = rnd(0.8, 1.8) + Math.min(level*0.05, 1.5);
  const verts = 7 + Math.floor(Math.random()*5);
  return {
    x, y, sz, r:info.r, hp:info.hp, maxHp:info.hp, pts:info.pts,
    vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
    rot:Math.random()*TAU, rotSpd:(Math.random()-0.5)*0.025,
    shape: Array.from({length:verts}, ()=>0.7+Math.random()*0.3)
  };
}

function drawRock(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  const n = a.shape.length;
  ctx.beginPath();
  for (let i=0; i<n; i++) {
    const ang = (i/n)*TAU;
    const r = a.r * a.shape[i];
    i===0 ? ctx.moveTo(Math.cos(ang)*r, Math.sin(ang)*r)
           : ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
  }
  ctx.closePath();
  ctx.fillStyle = a.sz==='large'?'#607d8b':a.sz==='medium'?'#78909c':'#90a4ae';
  ctx.fill();
  ctx.strokeStyle = '#b0bec5';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function spawnRocks() {
  const n = Math.min(3 + level, 10);
  for (let i=0; i<n; i++) {
    const p = edge();
    rocks.push(makeRock(p.x, p.y, null));
  }
}

// ── BULLETS ──────────────────────────────────────────────────────
function shoot() {
  const spd = 10;
  const angs = puT>0 ? [ship.angle-0.15, ship.angle, ship.angle+0.15] : [ship.angle];
  angs.forEach(a => {
    bullets.push({
      x: ship.x+Math.cos(a)*22, y: ship.y+Math.sin(a)*22,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      life: 55, enemy: false
    });
  });
}

// ── PARTICLES ────────────────────────────────────────────────────
function explode(x, y, n, col) {
  for (let i=0; i<n; i++) {
    const a = Math.random()*TAU, spd = rnd(1,5);
    parts.push({
      x, y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
      life: rnd(20,50), maxLife:50,
      r: rnd(1,3),
      col: col || `hsl(${rnd(20,50)},100%,${rnd(50,80)}%)`
    });
  }
}

// ── POWER-UPS ────────────────────────────────────────────────────
const PU_DEFS = [
  {type:'rapid',  col:'#ffeb3b', lbl:'⚡'},
  {type:'shield', col:'#4fc3f7', lbl:'🛡'},
  {type:'triple', col:'#ce93d8', lbl:'🔱'},
];

function maybeSpawnPU(x, y) {
  if (Math.random()>0.3) return;
  const d = PU_DEFS[Math.floor(Math.random()*PU_DEFS.length)];
  pups.push({x, y, vx:(Math.random()-0.5)*1.2, vy:(Math.random()-0.5)*1.2, life:280, r:12, ...d});
}

function drawPU(p) {
  const pulse = 0.85 + 0.15*Math.sin(frame*0.1);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.beginPath();
  ctx.arc(0, 0, p.r*pulse+5, 0, TAU);
  ctx.fillStyle = p.col+'22';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, p.r*pulse, 0, TAU);
  ctx.fillStyle = p.col;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.font = `${p.r}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.lbl, 0, 1);
  ctx.restore();
}

// ── BOSS ─────────────────────────────────────────────────────────
function makeBoss() {
  bossMaxHP = 25 + level*5;
  bossHP = bossMaxHP;
  bossActive = true;
  document.getElementById('bossBar').style.display = 'block';
  document.getElementById('bossFill').style.width = '100%';
  return {x:W/2, y:-90, vx:1.8, vy:1, r:58, angle:0, shootT:0, phase:1};
}

function drawBoss() {
  if (!boss) return;
  ctx.save();
  ctx.translate(boss.x, boss.y);

  // Spikes
  for (let i=0; i<8; i++) {
    const a = (i/8)*TAU + boss.angle;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*boss.r, Math.sin(a)*boss.r);
    ctx.lineTo(Math.cos(a)*(boss.r+20), Math.sin(a)*(boss.r+20));
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Body
  ctx.beginPath();
  ctx.arc(0, 0, boss.r*(0.97+0.03*Math.sin(frame*0.06)), 0, TAU);
  ctx.fillStyle = '#37474f';
  ctx.fill();
  ctx.strokeStyle = '#ff5252';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Eye tracking ship
  const toShip = Math.atan2(ship.y-boss.y, ship.x-boss.x);
  const ex = Math.cos(toShip)*16, ey = Math.sin(toShip)*16;
  ctx.beginPath();
  ctx.arc(0, 0, 24, 0, TAU);
  ctx.fillStyle = '#ff1744';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex, ey, 11, 0, TAU);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex+3, ey-3, 3.5, 0, TAU);
  ctx.fillStyle = '#fff';
  ctx.fill();

  ctx.restore();
}

function bossShoot() {
  const n = boss.phase===2 ? 8 : 4;
  for (let i=0; i<n; i++) {
    const a = (i/n)*TAU + boss.angle;
    bullets.push({
      x:boss.x+Math.cos(a)*boss.r, y:boss.y+Math.sin(a)*boss.r,
      vx:Math.cos(a)*3.5, vy:Math.sin(a)*3.5,
      life:130, enemy:true
    });
  }
}

// ── HIT SHIP ─────────────────────────────────────────────────────
function hitShip() {
  if (inv>0) return;
  if (puS>0) { puS=0; inv=60; explode(ship.x,ship.y,20,'#4fc3f7'); return; }
  lives--;
  inv = 110;
  explode(ship.x, ship.y, 25, '#ff5252');
  updateLives();
  if (lives<=0) { running=false; setTimeout(showOver, 500); }
  else { ship.x=W/2; ship.y=H/2; ship.vx=0; ship.vy=0; }
}

// ── FLASH TEXT ───────────────────────────────────────────────────
function flash(txt) {
  const el = document.getElementById('flash');
  el.textContent = txt;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity='0', 1500);
}

// ── HUD ──────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('hScore').textContent = score;
  document.getElementById('hLevel').textContent = level;
}

function updateLives() {
  const els = document.getElementById('hLives').querySelectorAll('.life');
  els.forEach((el,i) => el.classList.toggle('dead', i>=lives));
}

function updatePUs() {
  document.getElementById('puR').classList.toggle('on', puR>0);
  document.getElementById('puS').classList.toggle('on', puS>0);
  document.getElementById('puT').classList.toggle('on', puT>0);
}

// ── NEXT LEVEL ───────────────────────────────────────────────────
function nextLevel() {
  level++;
  clearFrames = 0;
  bullets=[]; rocks=[]; pups=[];
  boss=null; bossActive=false;
  document.getElementById('bossBar').style.display='none';
  inv=90;
  updateHUD();
  if (level%5===0) {
    flash('⚠ BOSS LEVEL '+level);
    setTimeout(()=>{ boss=makeBoss(); levelClearing=false; }, 1500);
  } else {
    flash('LEVEL '+level);
    setTimeout(()=>{ spawnRocks(); levelClearing=false; }, 600);
  }
}

// ── SCREENS ──────────────────────────────────────────────────────
function showOver() {
  document.getElementById('oScore').textContent = 'SCORE: '+score;
  document.getElementById('oLevel').textContent = 'REACHED LEVEL '+level;
  document.getElementById('sOver').classList.remove('off');
}

function startGame() {
  document.getElementById('sStart').classList.add('off');
  document.getElementById('sOver').classList.add('off');
  document.getElementById('bossBar').style.display='none';

  ship=makeShip();
  bullets=[]; rocks=[]; parts=[]; pups=[];
  boss=null; bossActive=false;
  score=0; lives=3; level=1; frame=0;
  puR=0; puS=0; puT=0; inv=90;
  shootCD=0; mult=1; multT=0;

  running=true;
  clearFrames=0;
  updateHUD(); updateLives(); updatePUs();
  flash('LEVEL 1');
  setTimeout(()=>{ spawnRocks(); levelClearing=false; }, 1200);
}

document.getElementById('btnStart').onclick  = startGame;
document.getElementById('btnRetry').onclick  = startGame;

// ── UPDATE ───────────────────────────────────────────────────────
function update() {
  if (!running) return;
  frame++;

  // Ship movement
  if (keys['ArrowLeft']||keys['KeyA'])  ship.angle -= 0.055;
  if (keys['ArrowRight']||keys['KeyD']) ship.angle += 0.055;
  ship.thrusting = !!(keys['ArrowUp']||keys['KeyW']);
  if (ship.thrusting) {
    ship.vx += Math.cos(ship.angle)*0.22;
    ship.vy += Math.sin(ship.angle)*0.22;
    explode(ship.x-Math.cos(ship.angle)*18, ship.y-Math.sin(ship.angle)*18, 1, 'hsl(35,100%,60%)');
  }
  ship.vx *= 0.985; ship.vy *= 0.985;
  ship.x += ship.vx; ship.y += ship.vy;
  wrap(ship);

  // Shoot
  if (shootCD>0) shootCD--;
  if (keys['Space'] && shootCD===0) { shoot(); shootCD = puR>0?6:18; }

  if (inv>0)  inv--;
  if (puR>0)  puR--;
  if (puS>0)  puS--;
  if (puT>0)  puT--;
  if (multT>0){ multT--; if(multT===0) mult=1; }

  // Bullets
  for (let i=bullets.length-1; i>=0; i--) {
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if (b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20) { bullets.splice(i,1); continue; }
    if (b.enemy && ship && dist(b,ship)<ship.r+4) { bullets.splice(i,1); hitShip(); }
  }

  // Rocks
  for (let i=rocks.length-1; i>=0; i--) {
    const a=rocks[i];
    a.x+=a.vx; a.y+=a.vy; a.rot+=a.rotSpd;
    wrap(a);

    // Bullet hits rock
    let hit = false;
    for (let j=bullets.length-1; j>=0; j--) {
      if (bullets[j].enemy) continue;
      if (dist(bullets[j],a)<a.r+4) {
        bullets.splice(j,1);
        a.hp--;
        explode(a.x,a.y,4,null);
        if (a.hp<=0) {
          score += a.pts * mult;
          mult = Math.min(mult+1, 8); multT=180;
          explode(a.x,a.y,a.sz==='large'?18:10,null);
          maybeSpawnPU(a.x,a.y);
          if (a.sz==='large')   for(let k=0;k<3;k++) rocks.push(makeRock(a.x+(Math.random()-0.5)*30,a.y+(Math.random()-0.5)*30,'medium'));
          else if (a.sz==='medium') for(let k=0;k<2;k++) rocks.push(makeRock(a.x+(Math.random()-0.5)*15,a.y+(Math.random()-0.5)*15,'small'));
          rocks.splice(i,1); hit=true;
        }
        break;
      }
    }
    if (hit) continue;

    // Rock hits ship
    if (ship && dist(a,ship)<a.r+ship.r-8) { rocks.splice(i,1); hitShip(); }
  }

  // Power-ups
  for (let i=pups.length-1; i>=0; i--) {
    const p=pups[i];
    p.x+=p.vx; p.y+=p.vy; p.life--;
    if (p.life<=0) { pups.splice(i,1); continue; }
    if (ship && dist(p,ship)<p.r+ship.r) {
      if (p.type==='rapid')  puR=300;
      if (p.type==='shield') puS=400;
      if (p.type==='triple') puT=300;
      explode(p.x,p.y,10,p.col);
      pups.splice(i,1);
    }
  }

  // Particles
  for (let i=parts.length-1; i>=0; i--) {
    const p=parts[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.97; p.vy*=0.97;
    p.life--;
    if (p.life<=0) parts.splice(i,1);
  }

  // Boss
  if (boss) {
    boss.angle += 0.022;
    boss.x += boss.vx; boss.y += boss.vy;
    if (boss.x<boss.r||boss.x>W-boss.r) boss.vx*=-1;
    boss.y = Math.max(boss.r, Math.min(H-boss.r, boss.y+boss.vy));
    if (boss.y<=boss.r||boss.y>=H-boss.r) boss.vy*=-1;
    if (bossHP<bossMaxHP*0.4) boss.phase=2;

    boss.shootT++;
    if (boss.shootT>=(boss.phase===2?55:85)) { bossShoot(); boss.shootT=0; }

    // Bullet hits boss
    for (let j=bullets.length-1; j>=0; j--) {
      if (bullets[j].enemy) continue;
      if (dist(bullets[j],boss)<boss.r+4) {
        bullets.splice(j,1);
        bossHP--;
        document.getElementById('bossFill').style.width=(bossHP/bossMaxHP*100)+'%';
        explode(boss.x+(Math.random()-0.5)*50, boss.y+(Math.random()-0.5)*50, 3,'#ff5252');
        if (bossHP<=0) {
          for(let k=0;k<6;k++) setTimeout(()=>explode(boss.x+(Math.random()-0.5)*100,boss.y+(Math.random()-0.5)*100,20,'#ff5252'),k*120);
          score += 1000*mult;
          boss=null; bossActive=false;
          document.getElementById('bossBar').style.display='none';
          flash('BOSS DEFEATED! +1000');
          setTimeout(nextLevel, 2200);
          return;
        }
      }
    }
    if (ship && dist(boss,ship)<boss.r+ship.r-10) hitShip();
  }

  // Level clear — only trigger after rocks have been empty for 60 consecutive frames
  if (running && !bossActive && rocks.length===0 && !boss && !levelClearing) {
    clearFrames = (clearFrames||0) + 1;
    if (clearFrames >= 60) {
      levelClearing = true;
      clearFrames = 0;
      nextLevel();
    }
  } else if (rocks.length > 0) {
    clearFrames = 0;
  }

  updateHUD(); updatePUs();
}

// ── DRAW ─────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle = '#010810';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  });

  // Particles
  parts.forEach(p => {
    const alpha = p.life/p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*alpha, 0, TAU);
    ctx.fillStyle = p.col.includes('hsl')
      ? p.col.replace('hsl','hsla').replace(')',`,${alpha})`)
      : p.col;
    ctx.fill();
  });

  pups.forEach(drawPU);
  rocks.forEach(drawRock);

  // Bullets
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.enemy?4:3, 0, TAU);
    ctx.fillStyle = b.enemy?'#ff5252':'#fff';
    ctx.fill();
    if (!b.enemy) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 6, 0, TAU);
      ctx.fillStyle = 'rgba(79,195,247,0.25)';
      ctx.fill();
    }
  });

  drawBoss();
  drawShip();
}

// ── LOOP ─────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ── INPUT ────────────────────────────────────────────────────────
window.addEventListener('keydown', e => { keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code]=false; });

// ── INIT ─────────────────────────────────────────────────────────
makeStars();
loop();
</script>
